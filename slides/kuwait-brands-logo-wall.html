<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuwait's Leading Brands — Logo Wall</title>
<style>
  :root {
    --ink: #0a0a0f;
    --muted: #6b7280;
    --line: #ececf0;
    --card: #ffffff;
    --bg: #f6f7f9;
    --accent: #2f6bff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 100vw;
    min-height: 100vh;
    background:
      radial-gradient(1400px 700px at 88% -8%, #ffffff 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, #fbfbfd 0%, var(--bg) 100%);
    padding: 40px 56px 34px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(1000px 560px at 108% 118%, rgba(47,107,255,0.06), transparent 60%);
    pointer-events: none;
  }

  header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; }
  .eyebrow {
    font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  h1 { font-size: 40px; line-height: 1.04; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
  .count {
    font-size: 14px; color: var(--muted); font-weight: 600;
    border: 1px solid var(--line); padding: 8px 16px; border-radius: 999px; background: #fff;
    white-space: nowrap;
  }

  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 11px;
    padding: 14px 10px;
    text-align: center;
    min-height: 0;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(15,20,40,.08); }

  /* iOS-squircle brand tile */
  .mark {
    width: 68px; height: 68px;
    border-radius: 18px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    box-shadow: 0 6px 16px rgba(15,20,40,.18), inset 0 1px 0 rgba(255,255,255,.35);
    overflow: hidden;
    flex: none;
  }
  .mark::after {
    content: "";
    position: absolute; left: 0; right: 0; top: 0; height: 55%;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0));
    pointer-events: none;
  }
  .mark.has-logo {
    background: #fff !important;
    border: 1px solid var(--line);
    box-shadow: 0 4px 12px rgba(15,20,40,.10);
  }
  .mark.has-logo::after { display: none; }
  .mark.has-logo img { width: 80%; height: 80%; object-fit: contain; }
  .mark.has-logo.dark {
    background: linear-gradient(145deg, #1c2030 0%, #343b52 100%) !important;
    border: none;
    box-shadow: 0 6px 16px rgba(15,20,40,.22);
  }
  .mono {
    font-weight: 800; letter-spacing: -0.02em; line-height: 1; z-index: 1;
    text-shadow: 0 1px 1px rgba(0,0,0,.12);
  }

  .name { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.15; letter-spacing: -0.01em; }
  .sub { font-size: 11px; color: var(--muted); margin-top: -2px; }

  footer {
    margin-top: 24px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--muted);
  }
  .brandtag { font-weight: 700; color: var(--ink); letter-spacing: -0.01em; font-size: 15px; }

  /* ---------- Tablet ---------- */
  @media (max-width: 820px) {
    .slide { width: 100%; min-height: 100dvh; overflow: visible; padding: 28px 22px 26px; }
    header { margin-bottom: 20px; }
    h1 { font-size: 30px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .mark { width: 58px; height: 58px; border-radius: 15px; }
  }

  /* ---------- Phones ---------- */
  @media (max-width: 560px) {
    html, body { height: auto; }
    .slide { width: 100%; min-height: 100dvh; overflow: visible; padding: 20px 14px 24px; }
    header {
      flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 16px;
    }
    .eyebrow { font-size: 12px; letter-spacing: 0.12em; margin-bottom: 6px; }
    h1 { font-size: 23px; line-height: 1.08; }
    .count { font-size: 12px; padding: 6px 12px; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .card { padding: 11px 6px; gap: 8px; border-radius: 13px; }
    .mark { width: 50px; height: 50px; border-radius: 13px; }
    .mark.has-logo img { width: 82%; height: 82%; }
    .mono { font-size: 20px !important; }
    .name { font-size: 11.5px; }
    .sub { font-size: 9.5px; }
  }

  /* ---------- Small phones ---------- */
  @media (max-width: 380px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    h1 { font-size: 21px; }
    .mark { width: 52px; height: 52px; }
  }
</style>
</head>

    "warbains": "logos/warbains.svg",
  };

  // Logos that are white/light — shown on a dark tile instead of white
  const darkTiles = new Set(["alghanimintl", "alrai", "baims", "maisalghanim", "mutawaalkazi", "myfatoorah", "nic", "royalehayat", "ssh"]);

  const grid = document.getElementById("grid");
  document.getElementById("count").textContent = companies.length + " companies";

  companies.forEach(([name, sub, mono, c1, c2, slug]) => {
    const card = document.createElement("div");
    card.className = "card";

    const mark = document.createElement("div");
    mark.className = "mark";
    mark.style.background = "linear-gradient(145deg, " + c1 + " 0%, " + c2 + " 100%)";

    const m = document.createElement("span");
    m.className = "mono";
    m.textContent = mono;
    const len = mono.length;
    m.style.fontSize = len >= 3 ? "19px" : len === 2 ? "25px" : "30px";
    mark.appendChild(m);

    // Try a real logo; fall back to the crafted tile if it isn't there.
    // Drop a file into logos/<slug>.png (or set logoSrc) and it appears automatically.
    const src = logoSrc[slug] || ("logos/" + slug + ".png");
    const img = new Image();
    img.alt = name;
    img.onload = function () {
      mark.classList.add("has-logo");
      if (darkTiles.has(slug)) mark.classList.add("dark");
      mark.style.background = "";
      mark.innerHTML = "";
      mark.appendChild(img);
    };
    img.src = src;

    const nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = name;

    const sb = document.createElement("div");
    sb.className = "sub";
    sb.textContent = sub;

    card.appendChild(mark);
    card.appendChild(nm);
    card.appendChild(sb);
    grid.appendChild(card);
  });
</script>
</body>
</html>
